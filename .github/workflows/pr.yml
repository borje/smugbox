name: Build and test

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # vipsgen/vips816 needs libvips 8.16 (Debian 13); same base as deploy/Dockerfile.
    container: golang:1.26-trixie
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends libvips-dev pkg-config
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  lightroom-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lightroom-plugin
    steps:
      - uses: actions/checkout@v4
      # Lightroom Classic embeds Lua 5.1.
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: for t in test_*.lua; do [ "$t" = test_stub.lua ] || lua5.1 "$t" || exit 1; done
